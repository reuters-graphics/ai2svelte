<!doctype html>
<html>
  <head>
    <title>Visual test preview</title>
    <style>
      body { margin: 0; font: 13px system-ui, sans-serif; }
      header { display: flex; gap: 12px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #ccc; position: sticky; top: 0; background: #fff; }
      iframe { border: 0; display: block; height: calc(100vh - 42px); }
      #frame { background: repeating-conic-gradient(#eee 0 25%, #fff 0 50%) 0 0 / 16px 16px; }
    </style>
  </head>
  <body>
    <header>
      <select id="fixture"></select>
      <input id="width" type="range" min="320" max="1600" step="1" value="800" />
      <output id="widthOut">800px</output>
      <label><input id="debug" type="checkbox" /> debug</label>
      <a id="open" target="_blank">open alone</a>
    </header>
    <div id="frame"><iframe id="view"></iframe></div>
    <script type="module">
      // Renders the bundles `pnpm test:visual:generate` left in .output.
      // Drag the width to step through the artboard breakpoints.
      const fixtures = await (await fetch("./fixtures.json")).json();
      const params = new URLSearchParams(location.search);
      // multiple-export fixtures list one entry per component
      const views = fixtures.flatMap((f) =>
        f.files ? f.files.map((file) => ({ ...f, label: `${f.name}/${file}`, bundle: `bundle-${file}.js` }))
                : [{ ...f, label: f.name, bundle: "bundle.js" }],
      );
      fixture.innerHTML = views.map((v) => `<option>${v.label}</option>`).join("");
      fixture.value = params.get("fixture") || views[0].label;
      width.value = params.get("width") || 800;
      debug.checked = params.has("debug");

      function render() {
        const f = views.find((x) => x.label === fixture.value);
        const dir = `/scripts/visual-test/.output/${f.name}`;
        const src = `harness.html?bundle=${dir}/${f.bundle}&assetsPath=${dir}&width=${width.value}${debug.checked ? "&debug=1" : ""}`;
        view.src = open.href = src;
        view.style.width = +width.value + 16 + "px";
        widthOut.value = width.value + "px";
        history.replaceState(null, "", `?fixture=${f.label}&width=${width.value}${debug.checked ? "&debug" : ""}`);
      }
      fixture.onchange = debug.onchange = render;
      width.onchange = render; // reload on release, not every pixel
      width.oninput = () => (widthOut.value = width.value + "px");
      render();
    </script>
  </body>
