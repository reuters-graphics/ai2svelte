name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai2svelte
    steps:
      - uses: actions/checkout@v4
      # the extension pins its own pnpm; the root package.json pin is for the docs site
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ai2svelte/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ai2svelte/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:es3
